<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inquiry Received | Stevie Rey Von</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="assets/logo/mark-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100svh; display: flex; align-items: center; justify-content: center;
         background: #0d0c0a; color: #eae3d4; text-align: center; padding: 2rem;
         font-family: "Cormorant Garamond", serif; }
  .card { max-width: 560px; }
  img.mark { width: min(320px, 70vw); margin: 0 auto 2rem; display: block; }
  .eyebrow { font-family: Jost, sans-serif; text-transform: uppercase; letter-spacing: .4em;
             font-size: .7rem; color: #c19a4e; display: block; margin-bottom: 1.2rem; }
  h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); font-weight: 500; line-height: 1.1; margin-bottom: 1.1rem; }
  p { font-size: 1.2rem; line-height: 1.6; color: #a49a88; margin-bottom: 2.2rem; }
  a.btn { font-family: Jost, sans-serif; text-transform: uppercase; letter-spacing: .24em; font-size: .72rem;
          color: #dcbc7d; border: 1px solid rgba(193,154,78,.4); padding: 1rem 2rem; text-decoration: none;
          border-radius: 2px; transition: all .3s; }
  a.btn:hover { background: #c19a4e; color: #0d0c0a; }
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="assets/logo/srv-gold.png" alt="Stevie Rey Von" />
    <span class="eyebrow">Breeding Inquiries</span>
    <h1>We've received your inquiry.</h1>
    <p>Thank you for your interest in Stevie Rey Von. The Theorem Ranch breeding office will be in touch shortly.</p>
    <a class="btn" href="/">Return to the site</a>
  </div>
</body>
</html>
